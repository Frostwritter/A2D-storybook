<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A2D Storybook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app">
    <aside class="rail" id="rail">
      <header class="rail-brand">
        <p class="brand" id="brand-title">Storybook</p>
        <p class="tagline" id="brand-tagline"></p>
      </header>

      <label class="search">
        <span class="sr-only">Search</span>
        <input type="search" id="search" placeholder="Search…" autocomplete="off" />
      </label>

      <div class="filters" id="filters"></div>

      <nav class="event-list" id="event-list" aria-label="Events"></nav>
    </aside>

    <main class="reader" id="reader">
      <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="rail" aria-expanded="false">
        Contents
      </button>

      <article class="page" id="page" hidden>
        <header class="page-header">
          <p class="page-meta" id="page-meta"></p>
          <h1 id="page-title"></h1>
          <p class="page-summary" id="page-summary"></p>
          <ul class="tag-row" id="page-tags"></ul>
        </header>
        <div class="page-body" id="page-body"></div>
        <footer class="page-nav">
          <button type="button" class="nav-btn" id="prev-btn">← Previous</button>
          <button type="button" class="nav-btn" id="next-btn">Next →</button>
        </footer>
      </article>

      <div class="empty" id="empty">
        <h1>Choose an entry</h1>
        <p>Events and story texts are listed on the left. Edit them in <code>content/events.json</code>.</p>
      </div>
    </main>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
